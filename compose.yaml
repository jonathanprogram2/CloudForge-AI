name: cloudforge-ai

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cloudforge
      POSTGRES_PASSWORD: local_dev_only_password
      POSTGRES_DB: cloudforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U cloudforge -d cloudforge
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - backend
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://cloudforge:local_dev_only_password@db:5432/cloudforge
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
    networks:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_modules:

networks:
  backend:
    driver: bridge
